# Supabase backend: test on Linux, deploy staging, then prove it with curl.
#
# The backend is the one part of SalahBuddy a cloud/web session can fully
# verify — but only here. The sandbox has no Docker (`supabase start` is out)
# and `*.supabase.co` is blocked by egress policy, so a session can get as far
# as "migrations apply to a scratch Postgres and the Deno helpers pass". The
# real project is only ever touched from this workflow, which is why the smoke
# job exists: it is the Phase A exit criterion from SPEC-V4 §10 ("staging
# accepts a signed-in user via a curl-level test") executed on every push.
#
# Public-repo safety, non-negotiable:
#   * push-triggered only — no `pull_request_target`, so a fork PR can never
#     run with repo secrets in scope,
#   * secrets reach the shell through `env:` only, never interpolated into a
#     `run:` script (a `${{ }}` inside `run:` is textual substitution, i.e. a
#     script-injection hole),
#   * no project ref, URL or key is written in this file; every one of them
#     comes from repo secrets/variables and is masked before anything is
#     printed,
#   * the smoke job authenticates with the PUBLISHABLE (anon) key only. That
#     key is safe to hold precisely because RLS — not key custody — is the
#     security boundary, which is the first thing the job proves.
name: backend

# Path-filtered so Swift-only pushes don't spend a run here (and vice versa:
# ios.yml ignores backend/**). dev/** matches ios.yml so a long-running v4
# session gets a verdict on every push without merging to staging first —
# but note that only `staging` deploys; dev branches stop after `test`.
#
# The negations matter on `staging`: "backend/**" matches every one of them, so
# a change to any would otherwise run `supabase link` → `db push` → `functions
# deploy` against the live project and mint three throwaway auth users that
# nothing deletes — for a change that deploys nothing.
#
#   * README.md — the docs. A typo fix is not a deploy.
#   * scripts/** — operator tooling (triage_reports.sh), run from a human's
#     terminal against whichever project their key names. It is neither schema
#     nor an edge function; `db push` and `functions deploy` would not carry a
#     line of it anywhere. The `test` job parses it instead (see "Check the
#     shell parses"), which runs whenever a real backend change does.
#
# tests/** is deliberately NOT excluded: a change to the suite is exactly what
# the `test` job exists to run.
on:
  push:
    branches: [staging, production, "dev/**"]
    paths:
      - "backend/**"
      - "!backend/README.md"
      - "!backend/scripts/**"
      - ".github/workflows/backend.yml"
  workflow_dispatch:

# Deliberately NOT cancel-in-progress: `test` would be safe to cancel, but
# killing this workflow mid `supabase db push` can leave the remote migration
# history half-applied. A superseded run wasting two minutes is the cheaper
# failure.
concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # Everything that can be proven without a Supabase project: the migrations
  # applied to a real Postgres 16 and asserted against, plus the edge functions
  # type-checked and unit-tested. Runs on every branch in the filter above.
  # ---------------------------------------------------------------------------
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      # postgres:16 matches what Supabase runs. The shim in tests/shim/ fakes
      # the pieces of a Supabase database the migrations lean on (auth.users,
      # auth.uid(), storage.*, the anon/authenticated/service_role roles) so
      # vanilla Postgres is enough — no Docker-in-Docker, no `supabase start`.
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      # Same contract run_sql_tests.sh honours locally; the password stays in
      # PGPASSWORD rather than the URI so it can never be echoed as part of a
      # printed conninfo string.
      PGURI: postgresql://postgres@localhost:5432/postgres
      PGPASSWORD: postgres

    steps:
      - uses: actions/checkout@v5

      - uses: denoland/setup-deno@v2
        with:
          # Pinned to the 2.x line, not a patch: the functions use only stable
          # Deno APIs, and Supabase's edge runtime tracks 2.x too.
          deno-version: v2.x

      - name: Ensure a psql client
        run: |
          # The ubuntu-latest image ships postgresql-client, but that is an
          # image detail, not a promise — install only if it vanishes.
          if ! command -v psql >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq postgresql-client
          fi
          psql --version

      # The repo's shell is real infrastructure and until now nothing checked a
      # line of it: run_sql_tests.sh IS the step below, and triage_reports.sh is
      # the hand tool that moderates reported photos on the live project with
      # the service-role key. A `bash -n` is a parse, not a lint — it catches
      # the unbalanced quote or the missing `fi` that would otherwise be found
      # by an operator, at a terminal, mid-moderation.
      #
      # shellcheck ships on ubuntu-latest, so this is a real gate rather than a
      # decorative one; the `command -v` fallback exists so a future runner
      # image dropping it degrades to the parse instead of going quietly green.
      # SC2207 is excused by name: run_sql_tests.sh splits a sorted file list on
      # purpose, in a directory it controls, and a blanket exclusion is honest
      # where silencing the whole severity would not be.
      - name: Check the shell parses
        run: |
          shopt -s nullglob
          files=(backend/scripts/*.sh backend/tests/*.sh)
          [ ${#files[@]} -gt 0 ] || { echo "no shell to check"; exit 1; }
          for f in "${files[@]}"; do bash -n "$f"; echo "  parsed $f"; done
          if command -v shellcheck >/dev/null; then
            shellcheck -S warning -e SC2207 "${files[@]}"
            echo "  shellcheck clean"
          else
            echo "  note: no shellcheck on this runner — parse only"
          fi

      - name: SQL suite (shim + migrations + assertions)
        run: backend/tests/run_sql_tests.sh

      # Type-check what actually gets deployed. `deno check` resolves the npm:
      # specifiers, so a bad import fails here rather than at deploy time.
      - name: Type-check edge functions
        working-directory: backend
        run: |
          deno check supabase/functions/_shared/*.ts \
                     supabase/functions/*/index.ts \
                     tests/deno/*.ts

      # No permission flags on purpose: the helpers are pure and every test
      # injects its own `fetch`, so a test that suddenly needs the network is a
      # test that stopped being a unit test.
      - name: Unit-test edge function helpers
        working-directory: backend
        run: deno test tests/deno/

  # ---------------------------------------------------------------------------
  # Deploy to the staging project. `staging` only — dev/** and production both
  # stop at `test` (see the production note at the bottom of this file).
  # ---------------------------------------------------------------------------
  deploy-staging:
    needs: test
    if: github.ref == 'refs/heads/staging'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      # Lets smoke-staging tell "deploy skipped for want of secrets" apart from
      # "deploy ran". Secrets cannot be read in a job-level `if:`, so the guard
      # has to be a step that publishes an output.
      configured: ${{ steps.guard.outputs.configured }}

    env:
      # The CLI reads all three from the environment; passing the password as
      # an argument would put it in the process list and in `--debug` output.
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_STAGING_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_STAGING_PROJECT_REF }}

    steps:
      - uses: actions/checkout@v5

      # A fork, a clone, or a repo whose secrets have not been filled in yet
      # should get a green, explanatory run — not a wall of red from a CLI
      # failing on an empty --project-ref.
      - name: Check staging credentials
        id: guard
        run: |
          missing=()
          [ -n "${SUPABASE_ACCESS_TOKEN:-}" ]  || missing+=("SUPABASE_ACCESS_TOKEN")
          [ -n "${SUPABASE_PROJECT_REF:-}" ]   || missing+=("SUPABASE_STAGING_PROJECT_REF")
          [ -n "${SUPABASE_DB_PASSWORD:-}" ]   || missing+=("SUPABASE_STAGING_DB_PASSWORD")
          if [ ${#missing[@]} -eq 0 ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
            echo "Staging credentials present — deploying."
            exit 0
          fi
          echo "configured=false" >> "$GITHUB_OUTPUT"
          {
            echo "### Staging deploy skipped"
            echo
            echo "Missing repo secret(s): \`${missing[*]}\`"
            echo
            echo "Add them under **Settings → Secrets and variables → Actions**"
            echo "(\`SUPABASE_ACCESS_TOKEN\` from the Supabase account tokens page,"
            echo "the ref and DB password from the staging project's settings)."
            echo "The tests above still ran — only the deploy was skipped."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::notice title=Staging deploy skipped::Missing ${missing[*]} — tests passed, deploy not attempted."

      - uses: supabase/setup-cli@v1
        if: steps.guard.outputs.configured == 'true'
        with:
          version: latest

      # working-directory: backend — the CLI looks for ./supabase/config.toml
      # relative to the working directory, and ours lives at backend/supabase.
      - name: Link staging project
        if: steps.guard.outputs.configured == 'true'
        working-directory: backend
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF"

      - name: Apply migrations (db push)
        if: steps.guard.outputs.configured == 'true'
        working-directory: backend
        # </dev/null makes the "apply these migrations?" prompt take its
        # non-interactive default instead of hanging if a future CLI version
        # decides stdin looks like a terminal.
        run: supabase db push --linked </dev/null

      # --use-api bundles server-side, so no Docker image pull on the runner.
      # No slugs listed: every function under supabase/functions/ ships, with
      # verify_jwt taken from config.toml (both are `true` — the functions
      # carry no repo secret of their own).
      - name: Deploy edge functions
        if: steps.guard.outputs.configured == 'true'
        working-directory: backend
        run: supabase functions deploy --project-ref "$SUPABASE_PROJECT_REF" --use-api

      - name: Summarise
        if: steps.guard.outputs.configured == 'true'
        run: |
          {
            echo "### Staging deploy"
            echo
            echo "- migrations pushed"
            echo "- edge functions deployed (\`notify\`, \`retention\`, \`sweep-orphans\`)"
          } >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------
  # Curl-level proof that the thing we just deployed behaves. This is the job
  # that would catch a migration that applies cleanly and still leaves the data
  # readable by the world — the SQL suite can only prove policies exist, this
  # proves the deployed stack enforces them over HTTP.
  #
  # Runs with the PUBLISHABLE key and throwaway users, nothing else. It never
  # needs the service-role key, and it must never be given one: a proof that
  # bypasses RLS proves nothing.
  # ---------------------------------------------------------------------------
  smoke-staging:
    needs: deploy-staging
    if: needs.deploy-staging.outputs.configured == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      # Repo *variables* are the intended home for these two: neither is a
      # secret (the URL is public in the app binary, the publishable key is
      # designed to ship to clients), and variables are readable in job logs
      # and in the Actions UI, which makes debugging a smoke failure possible.
      # Falls back to secrets of the same names so a repo that already stored
      # them as secrets keeps working. Both are masked below regardless.
      # Overrides only. Left unset, the proofs read the URL and publishable key
      # straight out of Sources/Core/Sync/SupabaseConfig.swift — see the guard
      # step for why that is the RIGHT default rather than a shortcut.
      STAGING_URL: ${{ vars.SUPABASE_STAGING_URL || secrets.SUPABASE_STAGING_URL }}
      STAGING_PUBLISHABLE_KEY: ${{ vars.SUPABASE_STAGING_PUBLISHABLE_KEY || secrets.SUPABASE_STAGING_PUBLISHABLE_KEY }}
      # Set to "true" only if the staging project deliberately has email
      # signups off; the auth-dependent proofs then report as skipped instead
      # of failing the run. Default (unset) = a project that cannot sign a user
      # in is a broken project and the build says so.
      AUTH_OPTIONAL: ${{ vars.SUPABASE_STAGING_AUTH_OPTIONAL }}
      # Supabase rejects @example.com outright (400 email_address_invalid), so
      # the throwaway users need a domain its validator accepts. Override with
      # the repo variable if this one ever stops working.
      CI_EMAIL_DOMAIN: ${{ vars.SUPABASE_STAGING_CI_EMAIL_DOMAIN || 'salahbuddy.app' }}
      RUN_TAG: ${{ github.run_id }}-${{ github.run_attempt }}

    steps:
      - uses: actions/checkout@v5

      # The client's own config IS the default source of these two values, and
      # deliberately so. They are publishable config that ships inside every
      # copy of the app — RLS, not key custody, is the security boundary, and
      # proof 1 is precisely the assertion that holding this key grants nothing.
      #
      # Reading them from Sources/ rather than from a repo variable makes the
      # proofs exercise THE VALUES THE APP ACTUALLY SHIPS. A second copy in
      # Settings could drift from the binary and the smoke run would still go
      # green while every phone on TestFlight talked to the wrong project.
      # A repo variable/secret still wins when set, for a fork or a throwaway
      # project that should not be pointed at this one.
      - name: Resolve staging URL + publishable key
        id: guard
        run: |
          set -uo pipefail
          CONFIG="Sources/Core/Sync/SupabaseConfig.swift"
          url="${STAGING_URL:-}"
          key="${STAGING_PUBLISHABLE_KEY:-}"
          source="repo variable/secret"

          if [ -z "$url" ] || [ -z "$key" ]; then
            if [ -f "$CONFIG" ]; then
              [ -n "$url" ] || url="$(grep -oE 'https://[a-z0-9]+\.supabase\.co' "$CONFIG" | head -1)"
              [ -n "$key" ] || key="$(grep -oE 'sb_publishable_[A-Za-z0-9_-]+' "$CONFIG" | head -1)"
              source="$CONFIG (the config the app ships)"
            fi
          fi

          if [ -n "$url" ] && [ -n "$key" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
            {
              echo "url<<EOF";  echo "$url"; echo "EOF"
              echo "key<<EOF";  echo "$key"; echo "EOF"
            } >> "$GITHUB_OUTPUT"
            echo "Resolved staging endpoint from: $source"
            exit 0
          fi

          echo "configured=false" >> "$GITHUB_OUTPUT"
          {
            echo "### Staging smoke test skipped"
            echo
            echo "Could not resolve the staging URL and publishable key."
            echo "They normally come from \`$CONFIG\`; set repo variables"
            echo "\`SUPABASE_STAGING_URL\` / \`SUPABASE_STAGING_PUBLISHABLE_KEY\`"
            echo "to point the proofs somewhere else."
            echo
            echo "The deploy itself succeeded — only the proofs were skipped."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::notice title=Smoke test skipped::could not resolve the staging endpoint."

      - name: Prove RLS, auth and the circle RPCs
        if: steps.guard.outputs.configured == 'true'
        shell: bash
        env:
          RESOLVED_URL: ${{ steps.guard.outputs.url }}
          RESOLVED_KEY: ${{ steps.guard.outputs.key }}
        run: |
          set -uo pipefail

          # ---- masking ------------------------------------------------------
          # Repo variables are NOT masked by GitHub. Mask the URL, the project
          # ref inside it and the key before a single request is made, so no
          # amount of curl verbosity or error text can print them in a log that
          # anyone on the internet can read.
          URL="${RESOLVED_URL%/}"
          KEY="$RESOLVED_KEY"
          echo "::add-mask::$URL"
          echo "::add-mask::$KEY"
          ref="$(printf '%s' "$URL" | sed -E 's#^https?://([^./]+)\..*#\1#')"
          if [ -n "$ref" ] && [ "$ref" != "$URL" ]; then echo "::add-mask::$ref"; fi

          PASSED=0
          FAILED=0
          SKIPPED=0
          RESULTS=()
          pass() { PASSED=$((PASSED + 1)); echo "  PASS  $1"; RESULTS+=("PASS|$1"); }
          fail() {
            FAILED=$((FAILED + 1)); echo "  FAIL  $1"; RESULTS+=("FAIL|$1")
            if [ -n "${2:-}" ]; then echo "        why: ${2}"; fi
          }
          skip() { SKIPPED=$((SKIPPED + 1)); echo "  SKIP  $1"; RESULTS+=("SKIP|$1"); }

          # ---- HTTP ---------------------------------------------------------
          # Sets CODE and RESP. Pass "-" for the JWT to call as pure anon (the
          # apikey alone), which is exactly the "attacker with the shipped key"
          # case proof 1 is about.
          CODE=""; RESP=""
          api() {
            local method="$1" path="$2" jwt="$3" body="${4:-}" raw
            local -a args=(--silent --show-error --max-time 30 -X "$method"
                           -H "apikey: $KEY" -H "Content-Type: application/json"
                           -H "Accept: application/json" -w $'\n%{http_code}')
            if [ "$jwt" != "-" ]; then args+=(-H "Authorization: Bearer $jwt"); fi
            if [ -n "$body" ]; then args+=(--data "$body"); fi
            raw="$(curl "${args[@]}" "$URL$path" 2>&1)" || raw="$raw"$'\n000'
            CODE="${raw##*$'\n'}"
            RESP="${raw%$'\n'*}"
          }
          jqr() { printf '%s' "$RESP" | jq -r "$1" 2>/dev/null || printf ''; }
          # Bodies are echoed on failure only, truncated, and never contain a
          # key — but they can contain an error mentioning one, so keep it short.
          why() { printf 'HTTP %s %s' "$CODE" "$(printf '%s' "$RESP" | head -c 200 | tr -d '\n')"; }

          # ---- cleanup ------------------------------------------------------
          # delete_account() purges every row the throwaway user created. The
          # auth.users row itself needs service_role, which this job must never
          # hold — the nightly `maintenance` workflow sweeps those shells once
          # they are 30 days old (backend/README.md, "Sweeping orphaned
          # accounts"). Leaving them is what makes the smoke user indis-
          # tinguishable from a real deleted account, which is the point: the
          # sweep is never given a rule that only fits CI.
          CLEANUP_JWTS=()
          cleanup() {
            local j
            for j in ${CLEANUP_JWTS[@]+"${CLEANUP_JWTS[@]}"}; do
              [ -n "$j" ] || continue
              api POST "/rest/v1/rpc/delete_account" "$j" '{}'
            done
            echo "cleanup: purged ${#CLEANUP_JWTS[@]} throwaway account(s)"
          }
          trap cleanup EXIT

          # ---- the anon probe, factored out --------------------------------
          # Used twice: once before any rows exist (a smoke check that the
          # endpoints answer at all) and once AFTER proof 5, while user C's
          # circle, profile, membership and post are live. The second call is
          # the one that proves anything: reading 0 rows from a table that is
          # genuinely empty would pass with RLS switched off entirely.
          #
          # 404 is NOT a denial. PostgREST answers 404/PGRST205 when a table is
          # missing from the schema cache — a renamed table, or a cache that has
          # not reloaded in the seconds since `db push`. Scoring that as a pass
          # reports a broken deploy as ten green ticks.
          # NO `select=` here, deliberately. Only posts/profiles/circles have an
          # `id`; circle_members and excused_days are keyed by composite primary
          # keys, so `select=id` answered 400 "column does not exist" — and the
          # old classifier scored that as LEAKED DATA, which is the worst way to
          # be wrong: a broken probe reported as a breach. Bare `?limit=1` asks
          # for whatever the row is, which is also closer to what an attacker
          # holding the publishable key would actually try.
          # EVERY table `authenticated` holds a grant on, not a hand-picked five.
          # The original list predated Phase D and never grew with the schema, so
          # the three tables where a leak would hurt most were the three nobody
          # was checking: devices (push tokens), nudges (who nudged whom) and
          # reports (who reported whom). recovery_weeks and custom_challenges
          # were missing too.
          #
          # Keep this in step with the grants in 20260821000200_rls.sql. SQL test
          # 12 already fails the build for a table that forgets RLS; this is the
          # over-HTTP half of the same assertion, and the two should name the
          # same set.
          PROBE_TABLES="posts profiles circles circle_members excused_days
                        recovery_weeks custom_challenges devices nudges reports"

          anon_reads_nothing() {
            local phase="$1" table mode rows
            for table in $PROBE_TABLES; do
              for mode in "apikey-only" "apikey+anon-bearer"; do
                if [ "$mode" = "apikey-only" ]; then
                  api GET "/rest/v1/$table?limit=1" "-"
                else
                  api GET "/rest/v1/$table?limit=1" "$KEY"
                fi
                rows="$(printf '%s' "$RESP" | jq 'if type=="array" then length else -1 end' 2>/dev/null || echo -1)"
                if [ "$CODE" = "401" ] || [ "$CODE" = "403" ]; then
                  pass "anon GET /$table ($mode, $phase) denied with $CODE"
                elif [ "$CODE" = "200" ] && [ "$rows" = "0" ]; then
                  pass "anon GET /$table ($mode, $phase) returned 0 rows"
                elif [ "$CODE" = "404" ]; then
                  fail "anon GET /$table ($mode, $phase): table missing from the schema cache" "$(why)"
                elif [ "$CODE" = "400" ]; then
                  # A malformed query is a broken TEST. Saying "leak" here cries
                  # wolf, and a smoke job nobody believes is worse than none.
                  fail "anon GET /$table ($mode, $phase): the probe itself is malformed" "$(why)"
                elif [ "$rows" = "-1" ]; then
                  fail "anon GET /$table ($mode, $phase): unreadable response" "$(why)"
                else
                  fail "anon GET /$table ($mode, $phase) LEAKED DATA" "$(why)"
                fi
              done
            done
          }

          # =====================================================================
          echo "== Proof 1: the publishable key alone reads nothing"
          # RLS is the boundary. Anonymous is either denied outright (no grants
          # to `anon`) or returns an empty set — anything else is a data leak.
          anon_reads_nothing "empty"

          # =====================================================================
          echo "== Proof 2: a throwaway user can sign up and sign in"
          AUTH_FAIL_REASON=""
          # Sets JWT and USER_ID for the caller — never $UID, which bash owns.
          # example.com is reserved and cannot receive mail, which is exactly
          # the point: these accounts are disposable.
          signup_and_signin() {
            local label="$1" email pw token
            email="salahbuddy-ci-${RUN_TAG}-${label}@${CI_EMAIL_DOMAIN}"
            pw="$(openssl rand -base64 21)"
            echo "::add-mask::$pw"

            api POST "/auth/v1/signup" "-" "$(jq -nc --arg e "$email" --arg p "$pw" '{email:$e,password:$p}')"
            if [ "$CODE" != "200" ] && [ "$CODE" != "201" ]; then
              AUTH_FAIL_REASON="signup returned HTTP $CODE: $(jqr '.error_code // .msg // .error_description // .error // "unknown"')"
              return 1
            fi
            if [ -z "$(jqr '.access_token // empty')" ] && [ -n "$(jqr '.confirmation_sent_at // empty')" ]; then
              AUTH_FAIL_REASON="signup succeeded but the project requires email confirmation, which a CI user can never complete"
              return 1
            fi

            api POST "/auth/v1/token?grant_type=password" "-" "$(jq -nc --arg e "$email" --arg p "$pw" '{email:$e,password:$p}')"
            token="$(jqr '.access_token // empty')"
            if [ "$CODE" != "200" ] || [ -z "$token" ]; then
              AUTH_FAIL_REASON="sign-in returned HTTP $CODE: $(jqr '.error_code // .msg // .error_description // .error // "no access_token"')"
              return 1
            fi
            echo "::add-mask::$token"
            JWT="$token"
            USER_ID="$(jqr '.user.id // empty')"
            CLEANUP_JWTS+=("$token")
            [ -n "$USER_ID" ]
          }

          # Loud either way: the whole point of this job is that a green tick
          # means the proofs ran. A project that cannot mint a user gets an
          # actionable failure, downgraded to a warning only when the repo has
          # explicitly said signups are off on purpose.
          auth_unavailable() {
            echo "::group::Email auth is not usable on the staging project"
            echo "Reason: ${AUTH_FAIL_REASON:-unknown}"
            echo
            echo "Proofs 3-5 (create_circle / join_circle / cross-circle isolation)"
            echo "need a real user JWT and could not run."
            echo
            # Three different problems wear the same failure here, and naming
            # the wrong one sends someone to the wrong dashboard page.
            case "${AUTH_FAIL_REASON:-}" in
              *email_address_invalid*)
                echo "The provider is FINE — Supabase rejected the ADDRESS, not the signup."
                echo "Its validator refuses example.com and other reserved domains."
                echo "Current domain: ${CI_EMAIL_DOMAIN}"
                echo "Set repo variable SUPABASE_STAGING_CI_EMAIL_DOMAIN to a domain"
                echo "Supabase accepts. Nothing is ever sent to it while 'Confirm"
                echo "email' is off, so it need not receive mail — only validate."
                ;;
              *requires\ email\ confirmation*|*confirmation_sent*)
                echo "Fix in the Supabase dashboard, STAGING PROJECT ONLY:"
                echo "  Authentication -> Sign In / Providers -> Email"
                echo "    * turn OFF 'Confirm email' — a CI user cannot read mail"
                ;;
              *signup*disabled*|*422*)
                echo "Fix in the Supabase dashboard, STAGING PROJECT ONLY:"
                echo "  Authentication -> Sign In / Providers -> Email"
                echo "    * enable the Email provider / allow new signups"
                ;;
              *)
                echo "Check Authentication -> Sign In / Providers -> Email on the"
                echo "STAGING project: the provider must be on, 'Confirm email' off."
                ;;
            esac
            echo
            echo "If email signups are off deliberately, set repo variable"
            echo "SUPABASE_STAGING_AUTH_OPTIONAL=true to downgrade this to a warning."
            echo "::endgroup::"
            if [ "${AUTH_OPTIONAL:-}" = "true" ]; then
              skip "sign up + sign in (auth disabled on purpose)"
              skip "create_circle returns a 6-char invite code"
              skip "second user joins with that code"
              skip "second user cannot see an unrelated circle's posts"
              echo "::warning title=Auth proofs skipped::${AUTH_FAIL_REASON}"
              return 0
            fi
            fail "sign up + sign in a throwaway user" "$AUTH_FAIL_REASON"
            echo "::error title=Staging auth is broken::${AUTH_FAIL_REASON}"
            return 1
          }

          JWT=""; USER_ID=""
          AUTH_OK=false
          if signup_and_signin a; then
            JWT_A="$JWT"; USER_A="$USER_ID"
            pass "user A signed up and signed in (access token received)"
            if signup_and_signin b; then
              JWT_B="$JWT"; USER_B="$USER_ID"
              pass "user B signed up and signed in"
              if signup_and_signin c; then
                JWT_C="$JWT"; USER_C="$USER_ID"
                pass "user C (the outsider) signed up and signed in"
                AUTH_OK=true
              else
                fail "user C sign-up" "$AUTH_FAIL_REASON"
              fi
            else
              fail "user B sign-up" "$AUTH_FAIL_REASON"
            fi
          else
            auth_unavailable || true
          fi

          if [ "$AUTH_OK" = "true" ]; then
            # ===================================================================
            echo "== Proof 3: create_circle mints a circle with a 6-char code"
            api POST "/rest/v1/rpc/create_circle" "$JWT_A" '{"p_name":"CI smoke"}'
            CIRCLE_A=""; CODE_A=""
            if [ "$CODE" = "200" ]; then
              CIRCLE_A="$(jqr 'if type=="array" then .[0] else . end | .id // empty')"
              CODE_A="$(jqr 'if type=="array" then .[0] else . end | .code // empty')"
              # The code is a live invite for as long as the circle exists, and
              # this log is public — assert its shape, never print its value.
              #
              # Harvested ONLY on success: a PostgREST error body is
              # {"code":"PGRST202",...}, and `.code` is the same field. Masking
              # that registers ::add-mask::PGRST202, after which every later
              # diagnostic prints the error code as *** — redacting the one
              # thing a failing run needs to say.
              if [ -n "$CODE_A" ]; then echo "::add-mask::$CODE_A"; fi
            fi
            if [ "$CODE" = "200" ] && [ -n "$CIRCLE_A" ]; then
              pass "create_circle returned a circle row"
            else
              fail "create_circle" "$(why)"
            fi
            if printf '%s' "$CODE_A" | grep -Eq '^[ABCDEFGHJKLMNPQRSTUVWXYZ23456789]{6}$'; then
              pass "invite code is 6 chars from the unambiguous alphabet (value masked)"
            else
              fail "invite code shape" "got ${#CODE_A} chars, not the 6-char no-I/O/0/1 alphabet"
            fi

            # ===================================================================
            echo "== Proof 4: a second user joins with that code"
            api POST "/rest/v1/rpc/join_circle" "$JWT_B" "$(jq -nc --arg c "$CODE_A" '{p_code:$c}')"
            joined="$(jqr 'if type=="array" then .[0] else . end | .id // empty')"
            if [ "$CODE" = "200" ] && [ "$joined" = "$CIRCLE_A" ]; then
              pass "join_circle put user B in user A's circle"
            else
              fail "join_circle" "$(why)"
            fi

            api GET "/rest/v1/circle_members?select=user_id" "$JWT_B"
            members="$(printf '%s' "$RESP" | jq 'if type=="array" then length else -1 end' 2>/dev/null || echo -1)"
            if [ "$members" = "2" ]; then
              pass "user B sees exactly 2 members (the roster is visible to circle-mates)"
            else
              fail "roster visibility" "expected 2 members, saw $members ($(why))"
            fi

            # ===================================================================
            echo "== Proof 5: an unrelated circle is invisible"
            api POST "/rest/v1/rpc/create_circle" "$JWT_C" '{"p_name":"CI outsider"}'
            CIRCLE_C=""; CODE_C=""
            if [ "$CODE" = "200" ]; then
              CIRCLE_C="$(jqr 'if type=="array" then .[0] else . end | .id // empty')"
              CODE_C="$(jqr 'if type=="array" then .[0] else . end | .code // empty')"
              if [ -n "$CODE_C" ]; then echo "::add-mask::$CODE_C"; fi
            fi
            if [ "$CODE" = "200" ] && [ -n "$CIRCLE_C" ]; then
              pass "user C created a third, unrelated circle"
            else
              fail "outsider circle creation" "$(why)"
            fi

            POST_ID="$(cat /proc/sys/kernel/random/uuid)"
            api POST "/rest/v1/posts" "$JWT_C" "$(jq -nc \
              --arg id "$POST_ID" --arg u "$USER_C" --arg c "$CIRCLE_C" \
              --arg d "$(date -u +%F)" --arg t "$(date -u +%FT%TZ)" \
              '{id:$id,user_id:$u,circle_id:$c,day_key:$d,prayer:"fajr",tier:"onTime",logged_at:$t,jamaat:false}')"
            if [ "$CODE" = "201" ] || [ "$CODE" = "200" ]; then
              pass "user C posted into their own circle"
            else
              fail "user C post insert" "$(why)"
            fi

            # A resting day too, so proof 6's anon read has a row to fail to see
            # in every one of the five tables it probes — including the one the
            # spec calls absolutely private.
            api POST "/rest/v1/excused_days" "$JWT_C" "$(jq -nc \
              --arg u "$USER_C" --arg c "$CIRCLE_C" --arg d "$(date -u +%F)" \
              '{user_id:$u,circle_id:$c,day_key:$d}')"
            if [ "$CODE" = "201" ] || [ "$CODE" = "200" ]; then
              pass "user C marked a resting day"
            else
              fail "user C excused_days insert" "$(why)"
            fi

            api GET "/rest/v1/posts?select=id,circle_id" "$JWT_B"
            body_b="$RESP"
            n_b="$(printf '%s' "$body_b" | jq 'if type=="array" then length else -1 end' 2>/dev/null || echo -1)"
            if [ "$CODE" = "200" ] && ! printf '%s' "$body_b" | grep -qF -- "$POST_ID"; then
              pass "user B CANNOT see user C's post (cross-circle RLS holds)"
            else
              fail "CROSS-CIRCLE LEAK: user B can see user C's post" "$(why)"
            fi
            if [ "$n_b" = "0" ]; then
              pass "user B's post feed is empty (only their own circle is in scope)"
            else
              fail "user B's feed" "expected 0 rows, saw $n_b"
            fi

            api GET "/rest/v1/circles?select=id" "$JWT_B"
            visible="$(printf '%s' "$RESP" | jq -r 'if type=="array" then (map(.id) | join(",")) else "" end' 2>/dev/null || printf '')"
            # Guarded on the status AND on CIRCLE_A being non-empty: `visible`
            # collapses to "" for any non-array response, so "" = "" would
            # otherwise report PASS for a run where create_circle had failed and
            # the GET returned a 401. Every sibling assertion checks $CODE; this
            # one used to be the exception.
            if [ "$CODE" = "200" ] && [ -n "$CIRCLE_A" ] && [ "$visible" = "$CIRCLE_A" ]; then
              pass "user B sees exactly one circle: their own"
            else
              fail "circle visibility for user B" "expected only their circle, saw $(printf '%s' "$RESP" | jq 'length' 2>/dev/null || echo '?') row(s)"
            fi

            # =================================================================
            echo "== Proof 6: anon still reads nothing, now that rows exist"
            # The assertion proof 1 could not make: user C's circle, membership,
            # profile and post are all live at this point, so a 0-row read here
            # is RLS doing its job rather than an empty table.
            anon_reads_nothing "populated"
          fi

          # ---- did we actually prove anything? -------------------------------
          # A green tick that proved nothing is the one outcome this job must
          # never produce. If the user-scoped proofs neither ran, nor failed,
          # nor were deliberately skipped, something aborted mid-script — say
          # so loudly instead of reporting proof 1's ten passes as success.
          if [ "$AUTH_OK" != "true" ] && [ "$SKIPPED" -eq 0 ] && [ "$FAILED" -eq 0 ]; then
            fail "the user-scoped proofs never ran" "the script stopped before proofs 3-5 without reporting why — check the log above"
          fi

          # ---- report --------------------------------------------------------
          echo
          echo "== Summary: $PASSED passed, $FAILED failed, $SKIPPED skipped"
          {
            echo "### Staging smoke proofs"
            echo
            echo "| result | assertion |"
            echo "| --- | --- |"
            for r in ${RESULTS[@]+"${RESULTS[@]}"}; do
              echo "| ${r%%|*} | ${r#*|} |"
            done
            echo
            echo "**$PASSED passed, $FAILED failed, $SKIPPED skipped.**"
          } >> "$GITHUB_STEP_SUMMARY"

          [ "$FAILED" -eq 0 ]

  # ---------------------------------------------------------------------------
  # Production deploy: deliberately NOT wired.
  #
  # There is no production Supabase project yet. The free tier caps the account
  # at two active projects and both slots are taken, so the production secrets
  # (SUPABASE_PRODUCTION_PROJECT_REF / SUPABASE_PRODUCTION_DB_PASSWORD) simply
  # do not exist — see XCODE-CLOUD.md, "Current state (2026-08-21)". Referring
  # to missing secrets here would give every push to `production` a red X for a
  # decision that was made on purpose, so pushes to `production` run `test` and
  # stop there.
  #
  # Wiring it up when the project exists is the only remaining step: copy
  # deploy-staging, swap `refs/heads/staging` for `refs/heads/production` and
  # the STAGING_* names for PRODUCTION_*, and leave the smoke job pointed at
  # staging (it signs up throwaway users and posts rows — never do that to a
  # project with real people's prayers in it).
