name: SalahBuddy
options:
  bundleIdPrefix: org.amacvoters
  deploymentTarget: { iOS: "17.0" }
  createIntermediateGroups: true
packages:
  Adhan: { url: https://github.com/batoulapps/adhan-swift, from: "1.4.0" }
  # v4: the real circle. Postgres + Auth + Storage + Realtime behind one client.
  Supabase: { url: https://github.com/supabase/supabase-swift, from: "2.55.1" }
  # v4: Google sign-in. 8.0+ accepts a CUSTOM NONCE, which is what Supabase's
  # OIDC verification needs (it compares sha256(nonce) to the id_token claim).
  GoogleSignIn: { url: https://github.com/google/GoogleSignIn-iOS, from: "9.2.0" }
settings:
  base:
    DEVELOPMENT_TEAM: 852AXZ2B57
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "2"
targets:
  SalahBuddy:
    type: application
    platform: iOS
    sources: [Sources]
    dependencies:
      - { package: Adhan }
      - { package: Supabase, product: Supabase }
      - { package: GoogleSignIn, product: GoogleSignIn }
    info:
      path: Sources/Info.plist
      properties:
        UILaunchScreen: {}
        CFBundleIconName: AppIcon
        # Derive the version from the build settings rather than letting
        # XcodeGen write its literal defaults ("1" / "1.0"). A literal here
        # WINS over CURRENT_PROJECT_VERSION at build time, which silently
        # defeated ci_post_clone.sh's build-number stamping: every Xcode Cloud
        # archive shipped as 1.0 (1) and App Store Connect refused it as a
        # duplicate of the manual upload, so no CI build ever reached
        # TestFlight.
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        # Export compliance, answered once here instead of by hand on every
        # single build. App Store Connect will not release a build to testers
        # until this question is settled, so a missing key showed up TWICE in
        # the TestFlight list: "Missing Compliance", and — because an
        # unreleased build cannot be distributed — no tester group assigned
        # either. One key fixes both.
        #
        # false is the accurate answer, not a shortcut: it declares no
        # NON-EXEMPT encryption. Everything here is exempt — HTTPS/TLS to
        # Supabase, Apple and Google sign-in over the same, and the SHA-256 in
        # AuthService's nonce, which is a hash rather than encryption and is
        # used for authentication regardless. Revisit only if the app ever
        # ships its own cryptography.
        ITSAppUsesNonExemptEncryption: false
        NSLocationWhenInUseUsageDescription: "SalahBuddy uses your location to calculate accurate prayer times."
        NSCameraUsageDescription: "SalahBuddy uses the camera so you can snap a quick photo when you pray and share it with your circle."
        NSPhotoLibraryUsageDescription: "SalahBuddy lets you pick a photo from your library for your prayer post."
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        # v4: Google sign-in needs its OAuth client id and the matching
        # reversed-client-id callback scheme. Both are public config.
        GIDClientID: 923951498597-445nb4q5o5k66imnbbul70h88s7bct72.apps.googleusercontent.com
        CFBundleURLTypes:
          - CFBundleTypeRole: Editor
            CFBundleURLSchemes:
              - com.googleusercontent.apps.923951498597-445nb4q5o5k66imnbbul70h88s7bct72
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.amacvoters.salahbuddymock
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # v4: Sign in with Apple + push. Kept OUT of Sources/ so XcodeGen
        # never mistakes it for a bundle resource.
        CODE_SIGN_ENTITLEMENTS: SalahBuddy.entitlements
  SalahBuddyTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    dependencies: [{ target: SalahBuddy }]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  SalahBuddy:
    build: { targets: { SalahBuddy: all } }
    test: { targets: [SalahBuddyTests] }
